<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flat by design (Joao, July 2026): no gradients, sheens, glows or shadows.
       Round 3 (Aug 2026), his pick of five: the AMBER PLATE. The tile is the
       brand, the mark is punched out of it, and the triangle and the dot share
       one colour, which was the note. No hairline rim any more: a solid amber
       tile holds its own edge on any Dock background, light or dark.
       NOTE, keep this comment free of double-hyphens and non-ASCII: the
       rasterize step parses this file as strict XML. -->
