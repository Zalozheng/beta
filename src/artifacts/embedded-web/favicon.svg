  <path d="M26.34 24.09 L26.34 41.91 L41.42 33.00 Z" fill="#1A1206" stroke="#1A1206" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="48" cy="18" r="5" fill="#1A1206"/>
